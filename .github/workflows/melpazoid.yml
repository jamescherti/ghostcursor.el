---

# melpazoid <https://github.com/riscy/melpazoid> build checks.

# If your package is on GitHub, enable melpazoid's checks by copying this file
# to .github/workflows/melpazoid.yml and modifying RECIPE and EXIST_OK below.

name: melpazoid
on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: jamescherti/setup-emacs@master
        with:
          version: '29.4'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          sudo apt-get update
          git clone https://github.com/riscy/melpazoid.git ~/melpazoid
          pip install ~/melpazoid
          cat ~/melpazoid/melpazoid/melpazoid.el
      - name: Run
        env:
          LOCAL_REPO: "${{ github.workspace }}"
          RECIPE: (ghostcursor :fetcher github :repo "jamescherti/ghostcursor.el" :branch "${{ github.ref_name }}")
          EXIST_OK: false
        run: echo $GITHUB_REF && make -C ~/melpazoid
